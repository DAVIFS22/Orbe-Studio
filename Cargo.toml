[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/orbe-studio", "apps/orbe-studio-cli", "xtask"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# internal
orbe-geom = { path = "crates/geom" }
orbe-color = { path = "crates/color" }
orbe-cms = { path = "crates/cms" }
orbe-raster = { path = "crates/raster" }
orbe-doc = { path = "crates/doc" }
orbe-ops = { path = "crates/ops" }
orbe-psd = { path = "crates/psd" }
orbe-codecs = { path = "crates/codecs" }
orbe-raw = { path = "crates/raw" }
orbe-affinity = { path = "crates/affinity" }
orbe-compose = { path = "crates/compose" }
orbe-gpu = { path = "crates/gpu" }
orbe-paint = { path = "crates/paint" }
orbe-algo = { path = "crates/algo" }
orbe-io = { path = "crates/io" }
orbe-text = { path = "crates/text" }
orbe-vector = { path = "crates/vector" }
orbe-format = { path = "crates/format" }
orbe-automation = { path = "crates/automation" }
orbe-plugins = { path = "crates/plugins" }
orbe-engine = { path = "crates/engine" }
orbe-ui-egui = { path = "crates/ui-egui" }
orbe-testkit = { path = "crates/testkit" }
orbe-tablet = { path = "crates/tablet" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the ~260 test binaries (#2204). CI sets the same through
# CARGO_PROFILE_DEV_DEBUG. To inspect locals in a debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/orbe-studio-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for the UI shell, and "s" for
# other crates except pixel processing, which keeps opt-level 3 for filters and compositing. panic
# stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"` is for
# the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

# Keep the browser shell compact as shared panel controls grow. Pixel-processing crates below
# retain their speed-oriented optimization level.
[profile.wasm-release.package.orbe-ui-egui]
opt-level = "z"

[profile.wasm-release.package.orbe-raster]
opt-level = 3
[profile.wasm-release.package.orbe-color]
opt-level = 3
[profile.wasm-release.package.orbe-cms]
opt-level = 3
[profile.wasm-release.package.orbe-compose]
opt-level = 3
[profile.wasm-release.package.orbe-algo]
opt-level = 3
[profile.wasm-release.package.orbe-paint]
opt-level = 3
