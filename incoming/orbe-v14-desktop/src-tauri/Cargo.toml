[package]
name = "orbe-imagem-studio"
version = "14.6.0"
description = "Editor de imagem local Orbe"
authors = ["Orbe Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
