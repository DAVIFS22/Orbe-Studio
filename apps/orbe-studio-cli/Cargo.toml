[package]
name = "orbe-cli"
description = "Headless ORBE: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional orbe-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["orbe-codecs/heif"]

[lints]
workspace = true

[lib]
name = "orbe_cli"
path = "src/lib.rs"

[[bin]]
name = "orbe-cli"
path = "src/main.rs"

[dependencies]
orbe-automation = { path = "../../crates/automation" }
orbe-engine = { workspace = true }
orbe-io = { workspace = true }
orbe-format = { path = "../../crates/format" }
orbe-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for orbe-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

