[package]
name = "orbe-io"
description = "Import/export between orbe documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to orbe-codecs; see its `heif` feature).
heif = ["orbe-codecs/heif"]

[dependencies]
orbe-geom = { workspace = true }
orbe-color = { workspace = true }
orbe-cms = { workspace = true }
orbe-raster = { workspace = true }
orbe-doc = { workspace = true }
orbe-compose = { workspace = true }
orbe-algo = { workspace = true }
orbe-psd = { workspace = true }
orbe-codecs = { workspace = true }
orbe-raw = { workspace = true }
orbe-affinity = { workspace = true }
orbe-text = { workspace = true }
orbe-paint = { workspace = true }
orbe-vector = { workspace = true }
orbe-format = { path = "../format" }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
# svg.rs inflates `.svgz` itself (with a size cap) so the XML can be checked before it is parsed;
# pdn.rs inflates Paint.NET's gzip pixel chunks.
flate2 = { workspace = true }
# ora.rs reads OpenRaster's stack.xml (already in the tree through usvg).
roxmltree = "0.20"
# SVG import (svg.rs): usvg parses, resvg rasterises what the shape model can't hold. Both are
# already in the tree through the UI's icon loader; text shaping needs the fonts feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "raster-images"] }

[dev-dependencies]
crc32fast = "1.5"
orbe-affinity = { workspace = true, features = ["synth"] }
flate2 = { workspace = true }
orbe-psd = { workspace = true, features = ["testgen"] }
orbe-raw = { workspace = true, features = ["testgen"] }
proptest = { workspace = true }
