[package]
name = "orbe-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
orbe-geom = { workspace = true }
orbe-color = { workspace = true }
orbe-cms = { workspace = true }
orbe-raster = { workspace = true }
orbe-doc = { workspace = true }
orbe-ops = { workspace = true }
orbe-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
orbe-paint = { workspace = true }
orbe-algo = { workspace = true }
orbe-text = { workspace = true }
orbe-vector = { workspace = true }
orbe-io = { workspace = true }
orbe-psd = { workspace = true }
orbe-format = { workspace = true }
orbe-plugins = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
orbe-codecs = { workspace = true }
flate2 = { workspace = true }
# Photoshop `.kys` shortcut sets (`edit.keyboardShortcuts` `importKys`); already in the tree
# through orbe-ui-egui and usvg.
roxmltree = "0.20"

[dev-dependencies]
orbe-affinity = { workspace = true, features = ["synth"] }
# Synthetic camera raw files for the open tests.
orbe-raw = { workspace = true, features = ["testgen"] }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
exr = { version = "1.73", default-features = false }
