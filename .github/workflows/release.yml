name: Build and publish Orbe updater release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: orbe-updater-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validar versão e configuração do Tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json

          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = [string]$package.version

          if ($tagVersion -ne $packageVersion) {
            throw "A tag ($tagVersion) não corresponde à versão do package.json ($packageVersion)."
          }

          if (!$config.plugins -or !$config.plugins.updater) {
            throw 'Configuração plugins.updater ausente em src-tauri/tauri.conf.json.'
          }

          if ([string]::IsNullOrWhiteSpace([string]$config.plugins.updater.pubkey)) {
            throw 'A chave pública do atualizador não está configurada no Tauri.'
          }

          if (!$config.plugins.updater.endpoints -or $config.plugins.updater.endpoints.Count -eq 0) {
            throw 'Nenhum endpoint de atualização foi configurado.'
          }

          Write-Host "Versão validada: $packageVersion"
          Write-Host "Tag validada: $env:GITHUB_REF_NAME"

      - name: Instalar dependências
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao instalar as dependências com npm ci.'
          }

      - name: Validar chaves de assinatura
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure o secret TAURI_SIGNING_PRIVATE_KEY nas configurações do repositório.'
          }

          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Configure o secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD nas configurações do repositório.'
          }

          Write-Host 'Os secrets de assinatura estão configurados.'

      - name: Compilar e publicar atualização assinada
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Orbe Imagem Studio ${{ github.ref_name }}'
          releaseBody: 'Atualização do Orbe Imagem Studio. Consulte as notas da versão.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          projectPath: .
