      - name: Localizar e gerar ícones do aplicativo
        shell: pwsh
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          $ErrorActionPreference = 'Stop'

          $iconsDir = Join-Path 'src-tauri' 'icons'
          New-Item -ItemType Directory -Force -Path $iconsDir | Out-Null

          Write-Host 'Procurando imagens que possam ser usadas como ícone...'

          $excluded = '[\\/](node_modules|target|\.git|dist|build)[\\/]'

          $candidates = @(
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.FullName -notmatch $excluded -and
                $_.Extension.ToLowerInvariant() -in @('.png', '.svg')
              }
          )

          if ($candidates.Count -eq 0) {
            throw 'Nenhum PNG ou SVG foi encontrado. Inclua o ícone original do Orbe no ZIP.'
          }

          Write-Host 'Imagens encontradas:'
          $candidates | ForEach-Object {
            Write-Host " - $($_.FullName)"
          }

          # Prioriza arquivos com nomes de ícone dentro da pasta do Tauri.
          $source = $candidates |
            Where-Object {
              $_.DirectoryName -match '[\\/]src-tauri[\\/]icons$' -and
              $_.BaseName -in @('icon', 'app-icon', 'logo')
            } |
            Select-Object -First 1

          # Procura nomes conhecidos em outras pastas.
          if (-not $source) {
            $source = $candidates |
              Where-Object {
                $_.BaseName -in @('app-icon', 'logo-app', 'app_logo', 'icon', 'logo')
              } |
              Select-Object -First 1
          }

          # Não escolhe uma imagem arbitrária silenciosamente.
          if (-not $source) {
            Write-Host 'Não foi encontrado um arquivo com nome conhecido.'
            throw 'Renomeie a imagem original do ícone do Orbe para icon.png ou app-icon.png e inclua-a no ZIP.'
          }

          Write-Host "Imagem escolhida: $($source.FullName)"

          if ($source.Extension.ToLowerInvariant() -eq '.png') {
            Add-Type -AssemblyName System.Drawing

            $image = [System.Drawing.Image]::FromFile($source.FullName)

            try {
              if ($image.Width -ne $image.Height) {
                throw "O PNG deve ser quadrado. Dimensões: $($image.Width)x$($image.Height)."
              }

              if ($image.Width -lt 256) {
                throw "O PNG precisa ter pelo menos 256x256 pixels. Dimensões: $($image.Width)x$($image.Height)."
              }
            }
            finally {
              $image.Dispose()
            }
          }

          Write-Host 'Gerando os ícones usando o Tauri CLI...'

          npm exec -- tauri icon "$($source.FullName)"

          if ($LASTEXITCODE -ne 0) {
            throw 'A geração dos ícones falhou. Consulte a mensagem de erro do Tauri acima.'
          }

          $iconIco = Join-Path $iconsDir 'icon.ico'

          if (-not (Test-Path $iconIco -PathType Leaf)) {
            throw "O Tauri não gerou o arquivo esperado: $iconIco"
          }

          if ((Get-Item $iconIco).Length -eq 0) {
            throw 'O arquivo icon.ico está vazio.'
          }

          Write-Host 'Ícone do Windows gerado e verificado.'
          Write-Host 'Arquivos gerados na pasta de ícones:'

          Get-ChildItem -Path $iconsDir -File |
            Select-Object -ExpandProperty Name
