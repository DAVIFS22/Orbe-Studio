      - name: Localizar e gerar ícones do aplicativo
        shell: pwsh
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Procurando imagens de ícone no projeto...'

          $iconsDir = 'src-tauri/icons'

          New-Item -ItemType Directory -Force -Path $iconsDir | Out-Null

          # Mostra no log os arquivos gráficos disponíveis.
          $candidates = @(
            Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](node_modules|target|\.git)[\\/]' -and
                $_.Extension -in @('.png', '.svg')
              }
          )

          if ($candidates.Count -eq 0) {
            throw 'Nenhum PNG ou SVG foi encontrado no projeto. Inclua a imagem original do aplicativo no ZIP.'
          }

          Write-Host 'Imagens encontradas:'

          $candidates | ForEach-Object {
            Write-Host (" - " + $_.FullName)
          }

          # Prioriza imagens que já estão na pasta padrão do Tauri.
          $source = $candidates |
            Where-Object {
              $_.DirectoryName -match '[\\/]src-tauri[\\/]icons$' -and
              $_.BaseName -in @('icon', 'app-icon', 'logo')
            } |
            Select-Object -First 1

          # Depois procura nomes conhecidos em outras pastas.
          if (-not $source) {
            $source = $candidates |
              Where-Object {
                $_.BaseName -in @('icon', 'app-icon', 'logo', 'logo-app')
              } |
              Select-Object -First 1
          }

          # Último recurso: uma imagem encontrada no projeto.
          # O log permite conferir qual arquivo foi selecionado.
          if (-not $source) {
            $source = $candidates | Select-Object -First 1
          }

          if (-not $source) {
            throw 'Não foi possível localizar uma imagem para gerar os ícones.'
          }

          Write-Host "Imagem selecionada: $($source.FullName)"

          if ($source.Extension -eq '.png') {
            Add-Type -AssemblyName System.Drawing

            $image = [System.Drawing.Image]::FromFile($source.FullName)

            try {
              if ($image.Width -ne $image.Height) {
                throw "A imagem precisa ser quadrada. Dimensões encontradas: $($image.Width)x$($image.Height)."
              }

              if ($image.Width -lt 256) {
                throw "A imagem precisa ter pelo menos 256x256 pixels. Dimensões encontradas: $($image.Width)x$($image.Height)."
              }
            }
            finally {
              $image.Dispose()
            }
          }

          # O Tauri gera os formatos necessários a partir do arquivo escolhido.
          npm exec -- tauri icon "$($source.FullName)"

          if ($LASTEXITCODE -ne 0) {
            throw 'O comando tauri icon falhou. Confira a imagem selecionada e o log acima.'
          }

          $iconIco = Join-Path $iconsDir 'icon.ico'

          if (-not (Test-Path $iconIco -PathType Leaf)) {
            throw "O ícone do Windows não foi gerado: $iconIco"
          }

          if ((Get-Item $iconIco).Length -eq 0) {
            throw 'O arquivo icon.ico foi criado, mas está vazio.'
          }

          Write-Host 'Ícone do Windows gerado e verificado com sucesso.'
